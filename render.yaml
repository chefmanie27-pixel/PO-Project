# Temporary test environment only. Free PostgreSQL expires after 30 days.
services:
  - type: web
    name: po-command-center-staging
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -w backend
    healthCheckPath: /api/v1/ready
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: HOST
        value: 0.0.0.0
      - key: SERVE_FRONTEND
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: po-command-center-staging-db
          property: connectionString
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-admin.json
databases:
  - name: po-command-center-staging-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []
